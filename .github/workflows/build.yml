name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    name: PS Vita VPK (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # QuickJS is the default engine since phase 6; the Duktape build is
        # kept for comparison and carries its engine in the artifact name.
        include:
          - engine: quickjs
            artifact: VitaSurf
          - engine: duktape
            artifact: VitaSurf-duktape
    container:
      # Pinned rather than :latest so a rebuilt base image cannot change the
      # package manager or vdpm behaviour underneath the build.
      image: vitasdk/vitasdk:2026.08
    permissions:
      contents: write
    steps:
      - name: Install build requirements
        run: |
          set -eu
          if command -v apk >/dev/null 2>&1; then
            apk update
            apk add bash cmake ninja git make pkgconf perl gperf flex bison \
                    zlib-dev libpng-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    bash cmake ninja-build git make pkg-config perl gperf flex bison \
                    zlib1g-dev libpng-dev
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm bash cmake ninja git make pkgconf perl gperf flex bison zlib libpng
          else
            echo "No supported package manager found" >&2
            exit 1
          fi
          for tool in cmake ninja git make pkg-config perl gperf flex bison; do
            command -v "$tool" >/dev/null 2>&1 || { echo "::error::$tool missing"; exit 1; }
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace safe for git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Vita packages
        run: |
          set -eu
          # curl-mbedtls conflicts with the image's OpenSSL-linked curl, and
          # pacman will not swap conflicting packages non-interactively, so
          # remove curl first (nodeps twice: skip dependency checks entirely).
          if vdpm list curl >/dev/null 2>&1; then
            VDPM_NONINTERACTIVE=1 vdpm remove --nodeps --nodeps curl
          fi
          VDPM_NONINTERACTIVE=1 vdpm zlib bzip2 libpng libjpeg-turbo freetype zstd mbedtls curl-mbedtls expat libvita2d quickjs-ng
          # Extra image decoders. NetSurf detects these with pkg-config
          # and builds without them if they are absent, so a toolchain
          # that has no package for one must not fail the build here.
          for opt in libwebp libjxl; do
            VDPM_NONINTERACTIVE=1 vdpm "$opt" || echo "note: vdpm has no $opt; that format stays off"
          done
          for lib in libwebp libjxl; do
            if PKG_CONFIG_PATH="$VITASDK/arm-vita-eabi/lib/pkgconfig" pkg-config --exists "$lib" 2>/dev/null; then
              echo "image decoder available: $lib"
            else
              echo "image decoder NOT available: $lib"
            fi
          done

      - name: Build NetSurf libraries
        run: ./scripts/build-deps.sh

      - name: Build NetSurf
        run: ./scripts/build-netsurf.sh
        env:
          VITASURF_JS_ENGINE: ${{ matrix.engine }}

      - name: Configure and build VPK
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVITASURF_JS_ENGINE="${{ matrix.engine }}" \
            -DVITASURF_BUILD_ID="${GITHUB_RUN_NUMBER}" \
            -DVITASURF_BUILD_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          cmake --build build

      - name: Symbol map
        # Crash dumps give offsets into the text segment. The function map
        # goes into the job log (gzip, base64) so an offset can be resolved
        # without downloading the ELF artifact.
        run: |
          arm-vita-eabi-readelf -lW build/VitaSurf | sed -n '/Program Headers/,/^$/p'
          arm-vita-eabi-nm -n --defined-only build/VitaSurf \
            | awk '$2 ~ /^[tTwW]$/ { print $1, $3 }' > build/VitaSurf.syms
          wc -l build/VitaSurf.syms
          echo "::group::VitaSurf.syms.gz base64"
          gzip -9 -c build/VitaSurf.syms | base64 -w 76
          echo "::endgroup::"
          # Resolve the offsets listed in scripts/crash-offsets.txt against
          # the first PT_LOAD segment, printing the functions around each.
          base=$(arm-vita-eabi-readelf -lW build/VitaSurf \
            | awk '$1 == "LOAD" { print $3; exit }')
          echo "text segment base $base"
          grep -v '^#' scripts/crash-offsets.txt | grep . | while read -r off; do
            addr=$(printf '%08x' $((base + off)))
            echo "== offset $off = 0x$addr"
            arm-vita-eabi-addr2line -f -i -p -e build/VitaSurf "0x$addr" | sed 's/^/  /'
            awk -v a="$addr" '$1 <= a' build/VitaSurf.syms | tail -6 | sed 's/^/  /'
            echo "  -- $addr --"
            awk -v a="$addr" '$1 > a' build/VitaSurf.syms | head -3 | sed 's/^/  /'
            echo "::group::disassembly around 0x$addr"
            arm-vita-eabi-objdump -d -l --no-show-raw-insn \
              --start-address=$((base + off - 0x60)) \
              --stop-address=$((base + off + 0x20)) build/VitaSurf | tail -n +7
            echo "::endgroup::"
          done

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: build/VitaSurf.vpk

      - name: Upload ELF for debugging
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-elf-${{ github.run_number }}
          path: |
            build/VitaSurf
            build/VitaSurf.syms

      - name: Rename VPK for the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.engine != 'quickjs'
        run: cp build/VitaSurf.vpk "build/${{ matrix.artifact }}.vpk"

      - name: Attach VPK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ matrix.artifact }}.vpk
          body: |
            VitaSurf ${{ github.ref_name }}

            Install VitaSurf.vpk with VitaShell. Logs are written to
            ux0:data/VitaSurf/log.txt.
