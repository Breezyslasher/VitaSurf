name: Fetch page fixture

# Downloads a web page with its CSS, scripts and images as the Vita would
# see it (mobile user agent) and pushes the result to a fixtures/<name>
# branch, so the page can be studied offline with NetSurf's monkey
# frontend. Edit fixtures/request.txt and push to run it.

on:
  push:
    paths:
      - fixtures/request.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Read the request
        id: req
        run: |
          set -eu
          # fixtures/request.txt: two lines, url=... and name=...
          url=$(sed -n 's/^url=//p' fixtures/request.txt | head -1)
          name=$(sed -n 's/^name=//p' fixtures/request.txt | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "fetching $url as fixtures/$name"

      - name: Download the page, its stylesheets and scripts
        run: |
          set -u
          mkdir -p /tmp/fixture
          python3 - "${{ steps.req.outputs.url }}" /tmp/fixture <<'PY'
          import re, sys, os, hashlib, urllib.request, urllib.parse, html as htmlmod
          url, out = sys.argv[1], sys.argv[2]
          UA = 'Mozilla/5.0 (PlayStation Vita; Mobile) NetSurf/3.11'
          def get(u):
              req = urllib.request.Request(u, headers={'User-Agent': UA,
                      'Accept': '*/*', 'Accept-Language': 'en'})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read(), r.headers.get('Content-Type', '')
          html, ctype = get(url)
          text = html.decode('utf-8', 'replace')
          open(os.path.join(out, 'page.raw.html'), 'wb').write(html)
          assets = {}
          def local_name(u, kind):
              h = hashlib.sha1(u.encode()).hexdigest()[:10]
              ext = {'css': '.css', 'js': '.js'}.get(kind, '')
              if kind == 'img':
                  ext = os.path.splitext(urllib.parse.urlparse(u).path)[1][:6] or '.bin'
              return kind + '_' + h + ext
          def fetch(u, kind):
              absu = urllib.parse.urljoin(url, htmlmod.unescape(u))
              if absu in assets:
                  return assets[absu]
              name = local_name(absu, kind)
              try:
                  data, _ = get(absu)
                  open(os.path.join(out, name), 'wb').write(data)
                  assets[absu] = name
                  print('ok  ', kind, len(data), absu[:120])
              except Exception as e:
                  print('FAIL', kind, absu[:120], e)
                  assets[absu] = None
              return assets[absu]
          def rewrite(m, kind):
              attr, quote, u = m.group(1), m.group(2), m.group(3)
              if u.startswith('data:') or u.startswith('#'):
                  return m.group(0)
              name = fetch(u, kind)
              return '%s=%s%s%s' % (attr, quote, name or u, quote)
          # stylesheets
          text = re.sub(r'(?i)(href)=(["\'])([^"\']*)\2(?=[^>]*rel=["\']?stylesheet)',
                        lambda m: rewrite(m, 'css'), text)
          text = re.sub(r'(?i)(?<=rel="stylesheet")([^>]*?)(href)=(["\'])([^"\']*)\3',
                        lambda m: m.group(1) + rewrite(re.match(r'(href)=(["\'])([^"\']*)\2', m.group(0)[len(m.group(1)):]), 'css'), text)
          # scripts
          text = re.sub(r'(?i)(<script[^>]*\s)(src)=(["\'])([^"\']*)\3',
                        lambda m: m.group(1) + rewrite(re.match(r'(src)=(["\'])([^"\']*)\2', m.group(0)[len(m.group(1)):]), 'js'), text)
          # images (src and srcset first candidate)
          text = re.sub(r'(?i)(<img[^>]*\s)(src)=(["\'])([^"\']*)\3',
                        lambda m: m.group(1) + rewrite(re.match(r'(src)=(["\'])([^"\']*)\2', m.group(0)[len(m.group(1)):]), 'img'), text)
          text = re.sub(r'(?i)\ssrcset=(["\'])[^"\']*\1', '', text)
          # MediaWiki: the page modules are loaded by the startup script at
          # runtime; also save one bundle with them for offline reading.
          mods = re.search(r'RLPAGEMODULES=\[([^\]]*)\]', text)
          if mods:
              names = ','.join(x.strip('"\' ') for x in mods.group(1).split(','))
              base = urllib.parse.urljoin(url, '/w/load.php')
              fetch(base + '?lang=en&modules=' + urllib.parse.quote(names, safe=',.') + '&skin=minerva&only=scripts', 'js')
              fetch(base + '?lang=en&modules=' + urllib.parse.quote(names, safe=',.') + '&skin=minerva&only=styles', 'css')
              fetch(base + '?lang=en&modules=startup&only=scripts&skin=minerva', 'js')
          open(os.path.join(out, 'page.html'), 'w').write(text)
          with open(os.path.join(out, 'assets.txt'), 'w') as f:
              for u, n in assets.items():
                  f.write('%s\t%s\n' % (n, u))
          PY
          ls -la /tmp/fixture | head -60
          du -sh /tmp/fixture

      - name: Push to the fixtures branch
        run: |
          set -eu
          cd /tmp/fixture
          git init -q
          git config user.name "fixture-bot"
          git config user.email "fixture-bot@users.noreply.github.com"
          git checkout -q -b "fixtures/${{ steps.req.outputs.name }}"
          git add -A
          git commit -q -m "Fixture: ${{ steps.req.outputs.url }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin "fixtures/${{ steps.req.outputs.name }}"
          echo "pushed fixtures/${{ steps.req.outputs.name }}"
