name: Generate the DOM surface list

# Every gap found so far came from a log: a site called something, it was
# missing, the page died. That finds one gap per run of one site. This
# takes the curated WebIDL the specs are written in and turns it into a
# list of every interface member a browser is supposed to have, so the
# conformance page can report all of them at once.
#
# Edit fixtures/idl-request.txt and push to run it. The generated file is
# committed back to the branch.

on:
  push:
    paths:
      - fixtures/idl-request.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the curated IDL
        run: |
          set -eu
          mkdir -p /tmp/idl && cd /tmp/idl
          npm pack @webref/idl >/dev/null 2>&1
          tar xzf webref-idl-*.tgz
          ls package/ | head -40
          echo "--- idl files ---"
          ls package/*.idl | wc -l

      - name: Extract the member list
        run: |
          set -eu
          python3 - <<'PY'
          import re, os, json, glob

          # Which specs to take. Everything a page touches through the DOM,
          # plus the odds and ends scripts reach for.
          WANT = ['dom', 'html', 'cssom', 'cssom-view', 'uievents', 'xhr',
                  'fetch', 'url', 'webstorage', 'web-animations', 'DOM-Parsing',
                  'selection-api', 'pointerevents', 'touch-events',
                  'css-typed-om', 'intersection-observer', 'resize-observer',
                  'referrer-policy', 'navigation-timing', 'hr-time',
                  'console', 'encoding', 'FileAPI', 'notifications',
                  # second batch: the rest of what a page reaches for
                  'streams', 'IndexedDB', 'WebCryptoAPI', 'websockets',
                  'performance-timeline', 'user-timing', 'webidl',
                  'fullscreen', 'page-visibility', 'css-font-loading',
                  'clipboard-apis', 'storage', 'mediaqueries',
                  'requestidlecallback', 'screen-orientation',
                  'battery-status', 'gamepad', 'vibration',
                  'compression', 'urlpattern', 'css-highlight-api']

          src = {}
          for path in glob.glob('/tmp/idl/package/*.idl'):
              name = os.path.basename(path)[:-4]
              if name in WANT:
                  src[name] = open(path, encoding='utf-8').read()
          print('specs found:', sorted(src))

          text = '\n'.join(src.values())
          # Strip comments so they cannot look like members.
          text = re.sub(r'//[^\n]*', '', text)
          text = re.sub(r'/\*.*?\*/', '', text, flags=re.S)

          # interface / interface mixin / partial interface bodies
          blocks = {}
          for m in re.finditer(
                  r'(?:partial\s+)?interface\s+(?:mixin\s+)?(\w+)[^{;]*\{(.*?)\n\};',
                  text, re.S):
              blocks.setdefault(m.group(1), []).append(m.group(2))

          # namespaces too. console is one, not an interface, which is why
          # console.assert was missing from this list while a page that
          # called it died on the spot.
          for m in re.finditer(
                  r'(?:partial\s+)?namespace\s+(\w+)[^{;]*\{(.*?)\n\};',
                  text, re.S):
              blocks.setdefault(m.group(1), []).append(m.group(2))

          # Foo includes Bar;  -> fold Bar's members into Foo
          includes = {}
          for m in re.finditer(r'(\w+)\s+includes\s+(\w+)\s*;', text):
              includes.setdefault(m.group(1), []).append(m.group(2))

          ATTR = re.compile(r'(?:readonly\s+)?attribute\s+[\w<>?\s,\[\]]+?\s(\w+)\s*;')
          METH = re.compile(r'^\s*(?:\[[^\]]*\]\s*)*(?:static\s+)?'
                            r'(?!attribute|constructor|iterable|maplike|setlike|const|readonly)'
                            r'[\w<>?\s,\[\]]+?\s(\w+)\s*\(', re.M)

          # The regexes also catch IDL keywords and type names from the
          # special member forms -- "getter Element (...)", "setter
          # undefined (...)". No real member name starts with a capital
          # or is a keyword, so drop those rather than report a browser
          # as missing a member called "attribute".
          KEYWORDS = {
              'attribute', 'undefined', 'object', 'getter', 'setter',
              'deleter', 'optional', 'constructor', 'static', 'readonly',
              'required', 'sequence', 'record', 'unrestricted', 'unsigned',
              'long', 'short', 'boolean', 'byte', 'octet', 'float',
              'double', 'any', 'void', 'iterable', 'maplike', 'setlike',
              'includes', 'partial', 'interface', 'dictionary', 'namespace',
              'typedef', 'enum', 'callback', 'or', 'true', 'false', 'null',
              'inherit', 'stringifier', 'mixin',
          }

          def clean(names):
              return {n for n in names
                      if n[:1].islower() and n not in KEYWORDS}

          def members(name, seen=None):
              seen = seen or set()
              if name in seen:
                  return set(), set()
              seen.add(name)
              attrs, meths = set(), set()
              for body in blocks.get(name, []):
                  attrs |= clean(ATTR.findall(body))
                  meths |= clean(METH.findall(body))
              for mixin in includes.get(name, []):
                  a, m = members(mixin, seen)
                  attrs |= a
                  meths |= m
              return attrs, meths

          out = {}
          for name in sorted(blocks):
              if name.endswith('Mixin') or name in includes.values():
                  pass
              a, m = members(name)
              if a or m:
                  out[name] = {'attributes': sorted(a), 'methods': sorted(m)}

          print('interfaces:', len(out))
          total = sum(len(v['attributes']) + len(v['methods']) for v in out.values())
          print('members:', total)

          os.makedirs('fixtures', exist_ok=True)
          with open('fixtures/surface.js', 'w') as f:
              f.write('/* Generated by .github/workflows/idl-surface.yml from\n')
              f.write(' * @webref/idl, the curated WebIDL of the specifications.\n')
              f.write(' * Do not edit: regenerate by touching fixtures/idl-request.txt.\n')
              f.write(' */\n')
              f.write('var SURFACE = ')
              json.dump(out, f, indent=0, sort_keys=True)
              f.write(';\n')
          print('wrote fixtures/surface.js',
                os.path.getsize('fixtures/surface.js'), 'bytes')
          PY

      - name: Commit it
        run: |
          set -eu
          git config user.name 'Breezyslasher'
          git config user.email '167659924+Breezyslasher@users.noreply.github.com'
          git add fixtures/surface.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Regenerate the DOM surface list from the specs

          Generated by .github/workflows/idl-surface.yml."
            git push
          fi
