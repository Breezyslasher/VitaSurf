name: CSS census

# Counts the CSS declarations real pages send and prints the ones libcss
# drops, so a batch of properties is chosen from what sites write rather
# than from what seems likely. Edit fixtures/css-census.txt and push.

on:
  push:
    paths:
      - fixtures/css-census.txt
      - scripts/css-census.py
      - .github/workflows/css-census.yml
  workflow_dispatch:

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Apply the patch series
        # The properties this project adds to libcss are in patches/, not
        # in the pinned submodule, so without this the census counts them
        # all as missing.
        run: |
          set -eu
          scripts/apply-patches.sh > /tmp/patches.log || {
            cat /tmp/patches.log
            exit 1
          }
          echo "applied $(grep -c PATCH /tmp/patches.log) patches"

      - name: Count what is understood and what is dropped
        run: python3 scripts/css-census.py fixtures/css-census.txt
        env:
          CENSUS_CUTOFF: "60"
