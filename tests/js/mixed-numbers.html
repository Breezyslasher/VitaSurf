<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Arithmetic on an integer and a float</title></head>
<body><pre id="out"></pre>
<script>
/* An integer with a float64 (a sum past 2^31, x * 0.5, i < n / 2) is
   added, subtracted, multiplied, divided, compared and taken modulo as two
   doubles at once, where it went through ToNumeric on each (VitaSurf,
   patch 0415). Every operator over every pair of awkward values must give
   what the spec gives. Each line gives the browser's answer in brackets. */
var o = document.getElementById('out');
function T(n, v){ o.textContent += 'XX ' + n + ': ' + v + '\n';
  try { console.log('XX ' + n + ': ' + v); } catch (e) {} }
var vals = [0, -0, 1, -1, 2, 3, 7, -7, 0.5, -0.5, 1.5, -2.25, 3.7, 255.28, 2147483647, -2147483648,
  2147483648, 4294967296, 1e21, -1e-7, 5e-324, 1.7976931348623157e308, NaN, Infinity, -Infinity];
var ops = {
  add: function (a, b) { return a + b; }, sub: function (a, b) { return a - b; },
  mul: function (a, b) { return a * b; }, div: function (a, b) { return a / b; },
  mod: function (a, b) { return a % b; }, lt: function (a, b) { return a < b; },
  lte: function (a, b) { return a <= b; }, gt: function (a, b) { return a > b; },
  gte: function (a, b) { return a >= b; }, eq: function (a, b) { return a == b; },
  seq: function (a, b) { return a === b; },
  addloc: function (a, b) { var c = a; c += b; return c; }
};
function key(r) { return Object.is(r, -0) ? '-0' : String(r); }
var h = 0, n = 0;
for (var k in ops) for (var i = 0; i < vals.length; i++) for (var j = 0; j < vals.length; j++) {
  var s = key(ops[k](vals[i], vals[j]));
  for (var c = 0; c < s.length; c++) h = (h * 31 + s.charCodeAt(c)) | 0;
  h = (h * 31 + 59) | 0; n++;
}
var sum = 0; for (var q = 0; q < 3000; q++) { sum += q * 1000003; sum -= 0.25; sum *= 1.0000001; }
var t = 2147483600; for (q = 0; q < 100; q++) t += 1;
var m = 0; for (q = 0; q < 10000; q++) m = (m * 31 + q) % 1000000007.5;
T('every pair (7500 -1522819175)', n + ' ' + h);
T('a sum that leaves the integers (4498963529779.77)', String(sum));
T('counting past 2^31 (2147483700 0 715827900)', t + ' ' + (t % 7.5) + ' ' + (t / 3));
T('a remainder by a fraction (633594847.5)', String(m));
</script>
</body></html>
