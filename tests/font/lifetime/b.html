<!DOCTYPE html>
<!-- Three faces of 1,400,000 bytes, for webfont-lifetime.sh: two pages' worth
     is more than the 6 MB the browser holds at once. -->
<html><head><meta charset="utf-8"><title>Web fonts b</title><style>
@font-face{font-family:Fb1;src:url(b1.woff2) format('woff2')}
.f1{font-family:Fb1,sans-serif}
@font-face{font-family:Fb2;src:url(b2.woff2) format('woff2')}
.f2{font-family:Fb2,sans-serif}
@font-face{font-family:Fb3;src:url(b3.woff2) format('woff2')}
.f3{font-family:Fb3,sans-serif}
</style></head><body><p class=f1>one</p><p class=f2>two</p><p class=f3>three</p></body></html>
