<!DOCTYPE html>
<!-- @container asks about the element's container, not the viewport:
     the same card is red in a 200px container and green in a 500px
     one; a named query reaches past a nearer container of another
     name; and a query with no container around it does not match.
     Expected console output: lines ending in "PASS". -->
<html><head><style>
body { margin: 0; }
.box { container-type: inline-size; }
#narrow { width: 200px; }
#wide { width: 500px; }
#outer { container: outer / inline-size; width: 600px; }
#inner { container-type: inline-size; width: 100px; }
.card { color: rgb(255, 0, 0); }
@container (min-width: 300px) { .card { color: rgb(0, 128, 0); } }
@container outer (min-width: 550px) { .named { color: rgb(0, 0, 255); } }
@container (min-width: 1px) { .lone { color: rgb(0, 128, 0); } }
.lone { color: rgb(1, 2, 3); }
</style></head><body>
<div class=box id=narrow><p class=card id=a>narrow</p></div>
<div class=box id=wide><p class=card id=b>wide</p></div>
<div id=outer><div id=inner><p class=named id=c>named</p></div></div>
<p class=lone id=d>no container</p>
<script>
setTimeout(function () {
  function c(id) { return getComputedStyle(document.getElementById(id)).color; }
  function t(label, got, want) {
    console.log((got === want ? 'PASS ' : 'FAIL ') + label + ' (' + got + ')'); }
  t('a card in a narrow container', c('a'), 'rgb(255, 0, 0)');
  t('the same card in a wide one', c('b'), 'rgb(0, 128, 0)');
  t('a named query skips a nearer container', c('c'), 'rgb(0, 0, 255)');
  t('no container: the query does not match', c('d'), 'rgb(1, 2, 3)');
}, 800);
</script></body></html>
