<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>container queries</title><style>
 body { margin: 0; }
 .wrap { container-type: inline-size; width: 300px; }
 div.b { width: 100px; height: 20px; background: #ddd; }
 @container (width >= 24rem) { #a { width: 60px; } }
 @container (width >= 100rem) { #b { width: 60px; } }
 @container card (min-width: 200px) { #c { width: 60px; } }
 @container card (min-width: 200px) { #f { width: 60px; } }
 .card { container: card / inline-size; width: 250px; }
 @container (inline-size > 10px) { #d { width: 60px; } }
 @container not (width < 10px) { #e { width: 60px; } }
</style></head>
<body>
<div class="wrap">
 <div class="b" id="a"></div>
 <div class="b" id="b"></div>
 <div class="b" id="c"></div>
 <div class="b" id="d"></div>
 <div class="b" id="e"></div>
</div>
<div class="card"><div class="b" id="f"></div></div>
<pre id="out"></pre>
<script>
/* @container is evaluated against the nearest ancestor with a
   container-type (and the right name, if the query has one), not the
   viewport: .wrap is 300px wide in an 800px window. */
var o = document.getElementById('out');
function T(n, v){ o.textContent += 'XX ' + n + ': ' + v + '\n';
  try { console.log('XX ' + n + ': ' + v); } catch (e) {} }
function W(id){ return Math.round(document.getElementById(id).getBoundingClientRect().width); }
window.addEventListener('load', function(){ setTimeout(function(){
  T('width >= 24rem does not apply in a 300px container', W('a'));
  T('width >= 100rem does not', W('b'));
  T('a named query skips an unnamed container', W('c'));
  T('a named query finds its container', W('f'));
  T('inline-size means width', W('d'));
  T('not (width < 10px) applies', W('e'));
}, 200); });
</script></body></html>
