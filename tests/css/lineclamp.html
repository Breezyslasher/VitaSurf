<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>-webkit-line-clamp</title>
<style>
body { margin: 0; font-size: 16px; line-height: 20px; }
.card { width: 200px; margin: 0 0 10px 0; }
/* a: two lines of a long title, with an ellipsis on the second */
.a { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
/* b: the standard spelling */
.b { line-clamp: 1; overflow: hidden; }
/* c: a clamp larger than the text changes nothing */
.c { display: -webkit-box; -webkit-line-clamp: 6; overflow: hidden; }
/* d: -webkit-inline-box is inline-block */
.d { display: -webkit-inline-box; width: 60px; height: 10px; background: #ccc; }
</style>
</head>
<body>
<div class="card a">one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen</div>
<div class="card b">one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen</div>
<div class="card c">one two three</div>
<span class="d"></span><span class="d"></span>
<pre id="out"></pre>
<script>
var o = document.getElementById('out');
function T(n, v){ o.textContent += 'XX ' + n + ': ' + v + '\n';
  try { console.log('XX ' + n + ': ' + v); } catch (e) {} }
function H(sel){ return Math.round(document.querySelector(sel).getBoundingClientRect().height); }
function chk(n, sel, want){ var got = H(sel); T(n, got + (got == want ? '' : ' (expected ' + want + ')')); }
window.addEventListener('load', function(){ setTimeout(function(){
  chk('two lines clamped', '.a', 40);
  chk('one line clamped', '.b', 20);
  chk('clamp beyond the text', '.c', 20);
  var ds = document.querySelectorAll('.d');
  var same = Math.round(ds[0].getBoundingClientRect().top) == Math.round(ds[1].getBoundingClientRect().top);
  T('inline-box boxes share a line', same ? 'yes' : 'no (expected yes)');
}, 200); });
</script>
</body>
</html>
