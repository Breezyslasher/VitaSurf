<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>flex in a column of unknown height, border-box min-height, flex shorthand</title><style>
 body { margin: 0; }
 /* Home Assistant's view: a row with a border-box min-height, holding a
    column of auto height, holding a flex: 1 child */
 #outer { display: flex; min-height: 300px; padding-top: 56px; box-sizing: border-box; }
 #view { flex: 100%; display: flex; flex-direction: column; }
 #sections { flex: 1; display: block; }
 #wrapper { min-height: 100%; }
 #content { height: 120px; background: #ddd; }
 .col { display: flex; flex-direction: column; width: 100px; gap: 20px; }
 .col div { width: 50px; height: 20px; background: #ddd; }
 #minbb { min-height: 200px; padding-top: 50px; box-sizing: border-box; }
 #maxbb { height: 300px; max-height: 100px; padding-top: 50px; box-sizing: border-box; }
 .shorthand { display: flex; }
</style></head>
<body>
<div id="outer"><div id="view"><div id="sections"><div id="wrapper"><div id="content"></div></div></div></div></div>
<div class="col" id="col"><div id="k1"></div><div id="k2"></div><div id="k3"></div></div>
<div id="minbb">x</div>
<div id="maxbb">x</div>
<div class="shorthand"><div id="f1" style="flex: 100%"></div><div id="f2" style="flex: none"></div><div id="f3" style="flex: auto"></div><div id="f4" style="flex: 1 30px"></div></div>
<pre id="out"></pre>
<script>
/* A flex: 1 item in a column of auto height grew to 2097151 pixels, the
   column around it came out 0 tall, min-height and max-height ignored
   box-sizing, and flex: 100% left flex-grow at 0. */
var o = document.getElementById('out');
function T(n, v){ o.textContent += 'XX ' + n + ': ' + v + '\n';
  try { console.log('XX ' + n + ': ' + v); } catch (e) {} }
function H(id){ return Math.round(document.getElementById(id).getBoundingClientRect().height); }
function Y(id){ var e = document.getElementById(id); return Math.round(e.getBoundingClientRect().top - e.parentNode.getBoundingClientRect().top); }
function F(id){ var s = getComputedStyle(document.getElementById(id)); return s.flexGrow + '/' + s.flexShrink + '/' + s.flexBasis; }
window.addEventListener('load', function(){ setTimeout(function(){
  T('outer, view, sections heights (a browser: 300 244 244; stretching a column item is not done yet, so 300 120 120 here)', [H('outer'), H('view'), H('sections')].join(' '));
  T('column items with gap 20 (0 40 80, each 20)', [Y('k1'), Y('k2'), Y('k3')].join(' ') + ', ' + H('k1'));
  T('border-box min-height 200 (200)', H('minbb'));
  T('border-box max-height 100 (100)', H('maxbb'));
  T('flex 100% none auto "1 30px"', [F('f1'), F('f2'), F('f3'), F('f4')].join(' '));
}, 200); });
</script></body></html>
