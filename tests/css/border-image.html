<!DOCTYPE html>
<!-- border-image: a gradient border ("border-image: linear-gradient(...)
     1") is painted in the border's ring and not over the padding box, a
     picture is cut into nine and its edges stretched along the sides,
     and a box whose border image has not loaded keeps its border. The
     plot output shows where each piece goes. -->
<html><head><meta charset="utf-8"><style>
body { margin: 0; }
div { width: 60px; height: 30px; margin: 10px; }
#grad { border: 6px solid black; border-image: linear-gradient(90deg, rgb(255, 0, 0), rgb(0, 0, 255)) 1; }
#pic { border: 5px solid black; border-image: url(red20x10.png) 5 stretch; }
#missing { border: 3px solid rgb(0, 128, 0); border-image: url(no-such-file.png) 3; }
#fill { border: 4px solid black; border-image: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)) 4 fill; }
</style></head><body>
<div id=grad></div><div id=pic></div><div id=missing></div><div id=fill></div>
</body></html>
