<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>text-overflow ellipsis</title><style>
 body { margin: 0; font-size: 16px; }
 div { width: 120px; height: 24px; white-space: nowrap; overflow: hidden; }
 #ell  { text-overflow: ellipsis; }
 #clip { text-overflow: clip; }
 #fits { text-overflow: ellipsis; }
 #span { text-overflow: ellipsis; }
</style></head>
<body>
<div id="ell">The quick brown fox jumps over the lazy dog</div>
<div id="clip">The quick brown fox jumps over the lazy dog</div>
<div id="fits">Short</div>
<div id="span"><span>The quick brown fox</span> jumps over the lazy dog</div>
</body></html>
