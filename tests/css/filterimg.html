<!DOCTYPE html><html><head><meta charset="utf-8"><title>blurred image</title>
<style>body{margin:0} img{display:block;margin:0 0 20px 40px} .b{filter:blur(2px)} .c{filter:blur(2px) grayscale(1)}</style></head>
<body><img src="red20x10.png" width="20" height="10"><img class="b" src="red20x10.png" width="20" height="10"><img class="c" src="red20x10.png" width="40" height="20"></body></html>
