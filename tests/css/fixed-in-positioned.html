<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>a fixed box inside a positioned box further down</title><style>
 body { margin: 0; }
 #spacer { height: 13px; }
 #rel { position: relative; }
 #fixed { position: fixed; top: 0; left: 0; width: 300px; height: 30px; background: #36c; }
 #plain { position: fixed; top: 0; left: 400px; width: 30px; height: 30px; background: #3c6; }
</style></head>
<body>
<div id="spacer"></div>
<div id="rel"><div><div id="fixed"></div></div></div>
<div id="plain"></div>
<pre id="out"></pre>
<script>
/* A fixed box was placed from its positioned ancestor as if that stood at
   the top of the page: inside one 13px down, top: 0 came out 13px down,
   which is where Home Assistant's header and sidebar sat. */
var o = document.getElementById('out');
function T(n, v){ o.textContent += 'XX ' + n + ': ' + v + '\n';
  try { console.log('XX ' + n + ': ' + v); } catch (e) {} }
function Top(id){ return Math.round(document.getElementById(id).getBoundingClientRect().top); }
window.addEventListener('load', function(){ setTimeout(function(){
  T('fixed top: 0 inside a positioned box 13px down (0)', Top('fixed'));
  T('fixed top: 0 with no positioned ancestor (0)', Top('plain'));
}, 200); });
</script></body></html>
