<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>box-shadow</title><style>
 body { margin: 0; background: #fff; }
 div { width: 100px; height: 40px; margin: 40px; background: #eee; }
 #hard  { box-shadow: 4px 6px rgba(0, 0, 0, 0.5); }
 #soft  { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
 #none  { box-shadow: none; }
 #inset { box-shadow: inset 0 1px 2px #000; }
 #cur   { color: red; box-shadow: 2px 2px; }
</style></head>
<body>
<div id="hard"></div>
<div id="soft"></div>
<div id="none"></div>
<div id="inset"></div>
<div id="cur"></div>
</body></html>
