<!DOCTYPE html>
<!-- An empty box with clear: both after a float has clearance, so the
     margin of the box after it does not collapse through it into its
     parent's top (CSS 2.1 8.3.1). The parent starts where the spacer
     ends, at 10px, and the float with it. -->
<html><head><meta charset="utf-8"><style>
body { margin: 0; }
.sp { height: 10px; }
.fl { float: left; width: 50px; height: 50px; background: #f80; }
.cl { clear: both; }
.after { height: 30px; margin-top: -20px; background: #0f0; }
</style></head><body>
<div class="sp"></div>
<div id="p"><div class="fl" id="f"></div><div class="cl"></div><div class="after" id="a"></div></div>
<script>
window.addEventListener('load', function () { setTimeout(function () {
  var p = Math.round(document.getElementById('p').getBoundingClientRect().top);
  var f = Math.round(document.getElementById('f').getBoundingClientRect().top);
  console.log('XX parent top ' + p + (p === 10 ? ' PASS' : ' FAIL (want 10)'));
  console.log('XX float top ' + f + (f === 10 ? ' PASS' : ' FAIL (want 10)'));
}, 200); });
</script></body></html>
