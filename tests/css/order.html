<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>flex order</title><style>
 body { margin: 0; }
 .row { display: flex; width: 300px; }
 .row div { width: 50px; height: 20px; background: #ddd; }
 .col { display: flex; flex-direction: column; width: 100px; }
 .col div { height: 20px; background: #ddd; }
 #a { order: 2; } #b { order: -1; } #c { }
 #d { order: 1; } #e { order: 1; } #f { order: 0; }
 #g { order: 3; } #h { }
</style></head>
<body>
<div class="row"><div id="a"></div><div id="b"></div><div id="c"></div></div>
<div class="row"><div id="d"></div><div id="e"></div><div id="f"></div></div>
<div class="col"><div id="g"></div><div id="h"></div></div>
<pre id="out"></pre>
<script>
/* order is computed by libcss and was never read, so flex items always
   laid out in source order. */
var o = document.getElementById('out');
function T(n, v){ o.textContent += 'XX ' + n + ': ' + v + '\n';
  try { console.log('XX ' + n + ': ' + v); } catch (e) {} }
function L(id){ return Math.round(document.getElementById(id).getBoundingClientRect().left); }
function Y(id){ return Math.round(document.getElementById(id).getBoundingClientRect().top); }
function seq(ids, f){ return ids.slice().sort(function(p, q){ return f(p) - f(q); }).join(''); }
window.addEventListener('load', function(){ setTimeout(function(){
  T('order -1, 0, 2 lays out b c a', seq(['a','b','c'], L));
  T('equal orders keep source order', seq(['d','e','f'], L));
  T('order works down a column too', seq(['g','h'], Y));
}, 200); });
</script></body></html>
