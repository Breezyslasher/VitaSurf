<!DOCTYPE html>
<!-- Outline-only inline SVG icons (Lucide, Feather, DaisyUI's) put stroke
     and stroke-width on the root and no fill on the shapes. The serialiser
     must not add a second stroke-width from the stylesheet's initial value,
     which made the markup ill-formed and dropped the whole icon.
     Expected: a blue square outline 2 wide, a green one 2 wide, a red one
     1 wide, then a magenta circle outline 2 wide. -->
<html><body>
<div style="width:48px;height:48px;background:#eee"><svg viewBox="0 0 24 24" stroke="#00f" stroke-width="2" width="20" height="20"><path d="M2 2h20v20H2z"/></svg></div>
<div style="width:48px;height:48px;background:#eee"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 2h20v20H2z" fill="none" stroke="#0f0" stroke-width="2"/></svg></div>
<div style="width:48px;height:48px;background:#eee"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 2h20v20H2z" fill="none" stroke="#f00"/></svg></div>
<div style="width:48px;height:48px;background:#eee"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="6" fill="none" stroke="#f0f" stroke-width="2"/></svg></div>
</body></html>
