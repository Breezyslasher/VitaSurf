<script>
var out = [];
function ok(name, got, want) { out.push((got === want ? 'PASS ' : 'FAIL ') + name + (got === want ? '' : ': ' + got + ', want ' + want)); }
function cs(id) { return getComputedStyle(document.getElementById(id)); }
addEventListener('load', function () {
  ok('a rule from the shared text', cs('t').color, 'rgb(0, 120, 0)');
  ok('a later rule from it', cs('u').marginLeft, '13px');
  ok('a different sheet beside them', cs('t').fontSize, '20px');
  var dups = document.querySelectorAll('style.dup');
  /* the last copy changed: it alone reads differently, and wins */
  dups[11].textContent = dups[11].textContent.replace('rgb(0, 120, 0)', 'rgb(0, 0, 160)');
  setTimeout(function () {
    ok('the changed copy', cs('t').color, 'rgb(0, 0, 160)');
    ok('the copies before it still apply', cs('u').marginLeft, '13px');
    dups[11].parentNode.removeChild(dups[11]);
    setTimeout(function () {
      ok('with it gone the shared text applies again', cs('t').color, 'rgb(0, 120, 0)');
      var extra = document.createElement('style');
      extra.textContent = dups[0].textContent.replace('rgb(0, 120, 0)', 'rgb(0, 120, 0)');
      document.head.appendChild(extra);
      setTimeout(function () {
        ok('a copy added by script', cs('u').marginLeft, '13px');
        dups[0].parentNode.removeChild(dups[0]);
        dups[1].parentNode.removeChild(dups[1]);
        setTimeout(function () {
          ok('the rest still apply after copies go', cs('t').color, 'rgb(0, 120, 0)');
          document.getElementById('out').textContent = out.join('\n');

  }, 100);
});
