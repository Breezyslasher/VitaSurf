<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Floated flex items</title>
<style>
.flex{display:flex;float:right;height:60px;border:1px solid #888}
.item{height:50%;padding:4px;border:1px solid #c00}
</style></head>
<body>
<!--
 A flex item's float does nothing (CSS Flexbox 4). Here the flex
 container is itself a float beside text, so it sits in an inline
 container, and its items name float: left and right. Their percentage
 heights look for a containing block: taken as floats, that was past the
 flex container and its float box to the inline container, which has no
 style, and the layout read through null (build 662 on google.com).
 Chrome lays the items out in order, each 40px high (30px, half the
 container, and the padding and border).
-->
<div id="host">Some text before
 <div class="flex" id="flex">
  <div class="item" id="a" style="float:right">first</div>
  <div class="item" id="b" style="float:left">second</div>
 </div>
 and after.</div>
<p id="out">running</p>
<script>
window.addEventListener('load',function(){setTimeout(function(){
 var a=document.getElementById('a'),b=document.getElementById('b');
 var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
 var ok=ra.left<rb.left&&Math.round(ra.height)===40&&Math.round(rb.height)===40;
 var msg=(ok?'PASS':'FAIL')+' a '+ra.left+','+ra.height+' b '+rb.left+','+rb.height;
 document.getElementById('out').textContent=msg;
 console.log('flex-item-float: '+msg);},0);
});
</script>
</body></html>
