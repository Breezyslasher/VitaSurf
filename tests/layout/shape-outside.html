<!DOCTYPE html>
<!--
  shape-outside (VitaSurf): lines wrap a float's shape, not its margin
  box, and only lines do: a block formatting context beside it still
  avoids the margin box. Each line of the text below starts with an
  inline-block marker whose left edge is read. Each line must say PASS;
  Chrome passes them all.
-->
<html><head><meta charset="utf-8"><title>shape-outside</title>
<style>
body { margin: 0; }
.wrap { width: 400px; font: 20px/20px monospace; position: relative; display: flow-root; }
.fl { float: left; width: 200px; height: 200px; }
#c1 .fl { shape-outside: circle(50%); }
#c2 .fl { shape-outside: inset(0 100px 0 0); }
#c3 .fl { shape-outside: polygon(0 0, 200px 0, 0 200px); }
#c4 .fl { shape-outside: inset(0 150px 0 0); shape-margin: 20px; }
#c5 .fl { shape-outside: none; }
#c6 .fl { float: right; shape-outside: polygon(200px 0, 200px 200px, 0 200px); }
#c7 .fl { shape-outside: content-box; padding-right: 120px; width: 80px; }
#c8 .fl { shape-outside: inset(0 100px 0 0); }
#c8 .bfc { overflow: hidden; height: 20px; }
b { display: inline-block; width: 4px; height: 20px; vertical-align: top; }
</style></head>
<body>
<div class="wrap" id="c1"><div class="fl"></div><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x</div>
<div class="wrap" id="c2"><div class="fl"></div><b></b>x</div>
<div class="wrap" id="c3"><div class="fl"></div><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x</div>
<div class="wrap" id="c4"><div class="fl"></div><b></b>x</div>
<div class="wrap" id="c5"><div class="fl"></div><b></b>x</div>
<div class="wrap" id="c6"><div class="fl"></div><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x<br><b></b>x</div>
<div class="wrap" id="c7"><div class="fl"></div><b></b>x</div>
<div class="wrap" id="c8"><div class="fl"></div><div class="bfc"><b></b></div></div>
<pre id="out"></pre>
<script>
var out = [];
function ok(name, got, want) { var l = (got === want ? 'PASS ' : 'FAIL ') + name + (got === want ? '' : ': ' + got + ', want ' + want); out.push(l); console.log('shape-outside: ' + l); }
function near(name, got, want, tol) { ok(name, Math.abs(got - want) <= tol, true); if (Math.abs(got - want) > tol) console.log('shape-outside:   got ' + got + ', want ' + want); }
function m(id, n) { var w = document.getElementById(id); var b = w.getElementsByTagName('b')[n]; return b.getBoundingClientRect().left - w.getBoundingClientRect().left; }
addEventListener('load', function () {
  /* circle(50%) of a 200px box: radius 100 about (100, 100); the row
     at 90..110 reaches 200, the first row (0..20) reaches 100 + sqrt(100^2 - 80^2) = 160 */
  near('circle: the first line', m('c1', 0), 160, 2);
  near('circle: the middle line', m('c1', 4), 200, 2);
  near('circle: the last line', m('c1', 9), 160, 2);
  ok('inset: the line passes the cut-away part', m('c2', 0), 100);
  /* the triangle's right edge is x = 200 - y; a row 20 tall reaches
     the edge at its top */
  near('polygon: the first line', m('c3', 0), 200, 2);
  near('polygon: the sixth line', m('c3', 5), 100, 2);
  near('polygon: the last line', m('c3', 9), 20, 2);
  ok('shape-margin widens the shape', m('c4', 0), 70);
  ok('none is the margin box', m('c5', 0), 200);
  /* a right float, its shape's left edge x = 200 - y from its own left
     at 200: the line ends there, so the marker is at the start */
  near('a right float: the line is as long as the shape lets it', document.getElementById('c6').getElementsByTagName('b')[0].getBoundingClientRect().left - document.getElementById('c6').getBoundingClientRect().left, 0, 1);
  ok('content-box: the box without its padding', m('c7', 0), 80);
  ok('a block formatting context avoids the margin box', m('c8', 0), 200);
  document.getElementById('out').textContent = out.join('\n');
  console.log('shape-outside: done');
});
</script>
</body></html>
