<!DOCTYPE html>
<!-- A subtree taken out of the document is put back with new children
     between two script-driven layout rebuilds, and one child is sized in
     rem: during a rebuild the unit context still named the old root
     style, which was freed with the old tree. Expected: "kept bold deeper child", "after", "forces a
     layout", "done", and no crash. -->
<html><body><div id="host"><p id="keep">kept <b>bold</b></p></div><p>after</p>
<script>
var keep=document.getElementById('keep'), host=document.getElementById('host');
window.addEventListener('load', function(){
  setTimeout(function(){
    keep.remove();
    document.body.appendChild(document.createElement('p')).textContent='forces a layout';
  }, 500);
  setTimeout(function(){
    host.appendChild(keep);
    var s=document.createElement('span'); s.textContent=' child'; s.style.fontSize='1rem'; keep.appendChild(s);
    var i=document.createElement('i'); i.textContent=' deeper'; keep.firstChild.nextSibling.appendChild(i);
  }, 2500);
  setTimeout(function(){ document.body.appendChild(document.createElement('p')).textContent='done'; }, 4500);
});
</script></body></html>
