<!DOCTYPE html>
<!-- IntersectionObserver reports after layout, as a browser's rendering
     update does: one first record for each target, measured, and a new
     one only when a threshold is crossed. Ours reported a new target as
     zero sized and out of view, from before its first layout, and again
     once laid out. A detached target has no root bounds and an
     unrendered one empty ones. Sizes are left out, as the two browsers'
     fonts and scrollbars differ. Expected lines are what Chrome prints. -->
<html><head><title>intersection observer</title></head><body><div id="c"></div>
<div style="height:3000px"></div><div id="far">far</div>
<pre id="out"></pre>
<script>
var out = [], calls = {};
function L(s) { out.push(s); }
function rb(e) { return e.rootBounds === null ? 'null' : e.rootBounds.width > 0 ? 'some' : 'empty'; }
function obs(name, el, opts) {
  calls[name] = 0;
  new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      calls[name]++;
      L(name + ': intersecting ' + e.isIntersecting + ', ratio ' + e.intersectionRatio +
        ', rect ' + (e.boundingClientRect.width > 0 ? 'sized' : 'empty') + ', root ' + rb(e));
    });
  }, opts).observe(el);
}
var hidden = document.createElement('div'); hidden.style.display = 'none'; document.body.appendChild(hidden); obs('display none', hidden);
var v = document.createElement('div'); v.textContent = 'v'; document.getElementById('c').appendChild(v); obs('visible', v);
obs('below the fold', document.getElementById('far'));
obs('detached', document.createElement('div'));
var h = document.createElement('div'), r = h.attachShadow({mode: 'open'}), g = document.createElement('span');
g.textContent = 'g'; r.appendChild(g); document.getElementById('c').appendChild(h); obs('in a shadow root', g);
window.addEventListener('load', function () {
  setTimeout(function () {
    var late = document.createElement('p'); late.textContent = 'late';
    document.getElementById('c').appendChild(late); obs('added after load', late);
  }, 50);
});
setTimeout(function () {
  /* each target's own lines; the order between observers is not
     something a page can lean on */
  out.sort();
  Object.keys(calls).sort().forEach(function (k) { L(k + ': ' + calls[k] + ' callback(s)'); });
  out.forEach(function (l) { console.log('XX ' + l); });
  document.getElementById('out').textContent = out.join('\n');
}, 1500);
</script></body></html>
