<!DOCTYPE html>
<!-- A component that puts the same <style> in every shadow root parses
     it once: later copies are empty while the first is in the document,
     and a copy takes over when the first leaves. -->
<html><head><title>shadow style once</title></head><body>
<div id="box"></div>
<script>
function ok(n,c){console.log((c?"PASS ":"FAIL ")+n);}
var CSS=':host{display:block;color:rgb(1,2,3)} .tip{width:10px}';
class TipEl extends HTMLElement{connectedCallback(){
 if(this.shadowRoot)return;
 this.attachShadow({mode:'open'}).innerHTML='<style>'+CSS+'</style><span class="tip">t</span>';}}
customElements.define('tip-el',TipEl);
class TipApp extends HTMLElement{connectedCallback(){
 if(this.shadowRoot)return;
 var s=document.createElement('style');s.textContent=CSS;
 this.attachShadow({mode:'open'}).appendChild(s);}}
customElements.define('tip-app',TipApp);
var box=document.getElementById('box'),i;
for(i=0;i<50;i++)box.appendChild(document.createElement('tip-el'));
function full(){var st=document.getElementsByTagName('style'),n=0;
 for(var k=0;k<st.length;k++)if(st[k].textContent===CSS)n++;return n;}
ok("fifty components leave one full copy", full()===1);
ok("the other copies are empty <style> elements", document.getElementsByTagName('style').length===50);
box.removeChild(box.firstChild);
box.appendChild(document.createElement('tip-el'));
ok("with the first gone, a new copy is kept full", full()===1);
for(i=0;i<5;i++)box.appendChild(document.createElement('tip-app'));
ok("appendChild of a style into a shadow root is folded too", full()===1);
var m=document.createElement('div');m.attachShadow({mode:'open'});
var ms=document.createElement('style');ms.setAttribute('media','print');ms.textContent=CSS;m.shadowRoot.appendChild(ms);
ok("a style with attributes is left alone", ms.textContent===CSS);
var plain=document.createElement('style');plain.textContent=CSS;document.body.appendChild(plain);
ok("a style outside any shadow root is untouched", plain.textContent===CSS);
</script></body></html>
