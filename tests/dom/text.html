<!DOCTYPE html><html><head><title>text</title></head><body>
<pre id="out"></pre>
<div id="d">hello <b>bold</b> tail</div>
<script src="_probe.js"></script>
<script>
var d=document.getElementById('d'), t=d.firstChild;
T('nodeType', t.nodeType);
T('data', t.data);
T('length', t.length);
T('substringData', t.substringData(1,3));
t.appendData('!');
T('appendData', t.data);
t.insertData(0,'>');
T('insertData', t.data);
t.deleteData(0,1);
T('deleteData', t.data);
t.replaceData(0,5,'HELLO');
T('replaceData', t.data);
T('wholeText', t.wholeText);
T('nodeValue', t.nodeValue);
var s=document.createTextNode('abcdef');
var rest=s.splitText(3);
T('splitText left', s.data);
T('splitText right', rest.data);
T('textContent of div', d.textContent);
T('comment data', (function(){var e=document.createElement('div');
  e.innerHTML='<!--hi-->';var c=e.firstChild;
  return c?c.nodeType+':'+c.data:'none';})());
T('set data', (function(){var n=document.createTextNode('x');n.data='y';return n.textContent;})());
T('empty text length', document.createTextNode('').length);
T('createTextNode nodeName', document.createTextNode('x').nodeName);
</script></body></html>
