<!DOCTYPE html>
<!-- WebAssembly runs: a module compiles, instantiates with a JavaScript
     import, calls both ways with i32 and i64, traps as a RuntimeError,
     lets an import's exception through unchanged, grows its memory and
     detaches the old buffer, and keeps externref values across a table.
     The web platform tests in tests/wpt/wasm cover the API in depth. -->
<html><head><title>t</title></head><body><div id="out"></div>
<script>
function ok(n,c){var m=(c?"PASS ":"FAIL ")+n;console.log(m);var d=document.createElement("div");d.textContent=m;document.getElementById("out").appendChild(d);}
var bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,20,4,96,1,127,0,96,2,127,127,1,127,96,0,0,96,2,126,126,1,126,2,11,1,3,101,110,118,3,108,111,103,0,0,3,5,4,1,0,2,3,5,3,1,0,1,7,37,5,3,97,100,100,0,1,6,99,97,108,108,105,116,0,2,4,116,114,97,112,0,3,3,109,101,109,2,0,5,109,117,108,54,52,0,4,10,28,4,7,0,32,0,32,1,106,11,6,0,32,0,16,0,11,3,0,0,11,7,0,32,0,32,1,126,11,0,8,4,118,105,116,97,1,2,3]);
try {
ok("WebAssembly is there", Object.prototype.toString.call(WebAssembly) === '[object WebAssembly]' && typeof WebAssembly.instantiate === 'function');
ok("the native object is gone", typeof window.__vitaWasm === 'undefined');
ok("validate", WebAssembly.validate(bytes) && !WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1])));
var m = new WebAssembly.Module(bytes), seen = [];
ok("imports and exports", JSON.stringify(WebAssembly.Module.imports(m)) === '[{"module":"env","name":"log","kind":"function"}]' && WebAssembly.Module.exports(m).map(function (e) { return e.name; }).join() === 'add,callit,trap,mem,mul64');
ok("a custom section", new Uint8Array(WebAssembly.Module.customSections(m, 'vita')[0]).join() === '1,2,3');
var i = new WebAssembly.Instance(m, { env: { log: function (x) { seen.push(x); } } }), x = i.exports;
ok("an i32 call wraps", x.add(2, 40) === 42 && x.add(2147483647, 1) === -2147483648);
ok("an i64 call takes and gives BigInt", x.mul64(3n, -5n) === -15n);
var threw = null; try { x.mul64(3, 5); } catch (e) { threw = e; }
ok("an i64 call refuses a Number", threw instanceof TypeError);
x.callit(7);
ok("wasm calls the import", seen.join() === '7');
threw = null; try { x.trap(); } catch (e) { threw = e; }
ok("a trap is a RuntimeError", threw instanceof WebAssembly.RuntimeError && threw.message === 'unreachable');
var boom = new SyntaxError('boom'), j = new WebAssembly.Instance(m, { env: { log: function () { throw boom; } } });
threw = null; try { j.exports.callit(1); } catch (e) { threw = e; }
ok("an import's exception comes through unchanged", threw === boom);
var mem = x.mem, b = mem.buffer;
new Uint8Array(b)[10] = 99;
ok("memory is a Memory and keeps its buffer", mem instanceof WebAssembly.Memory && mem.buffer === b && b.byteLength === 65536);
ok("growing it detaches the old buffer and keeps the data", mem.grow(1) === 1 && b.byteLength === 0 && mem.buffer.byteLength === 131072 && new Uint8Array(mem.buffer)[10] === 99);
var t = new WebAssembly.Table({ element: 'externref', initial: 1 }), objs = [];
for (var k = 0; k < 2000; k++) { var o = { k: k }; objs.push(o); t.set(0, o); }
ok("a table keeps the last of many externrefs", t.get(0) === objs[1999] && t.grow(2, 'x') === 1 && t.get(2) === 'x');
var g = new WebAssembly.Global({ value: 'i64', mutable: true }, 1n); g.value = 1n << 40n;
ok("a Global holds an i64", g.value === 1099511627776n);
threw = null; try { new WebAssembly.Instance(m, { env: { log: 1 } }); } catch (e) { threw = e; }
ok("a bad import is a LinkError", threw instanceof WebAssembly.LinkError);
WebAssembly.instantiate(bytes, { env: { log: function () {} } }).then(function (r) {
 ok("instantiate resolves to a module and an instance", r.module instanceof WebAssembly.Module && r.instance.exports.add(1, 2) === 3);
 console.log('DONE');
}, function (e) { ok("instantiate resolves: " + e, false); console.log('DONE'); });
} catch (e) { ok("no exception: " + e + ' ' + e.stack, false); console.log('DONE'); }
</script></body></html>
