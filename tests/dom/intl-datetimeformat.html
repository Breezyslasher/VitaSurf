function fail(m) { fails++; console.log('FAIL ' + m); }
CASES.forEach(function (c) {
	var loc = c[0], o = c[1], t = c[2], t2 = c[3], want = c[4];

	n++;

		var f = new Intl.DateTimeFormat(loc, o);
