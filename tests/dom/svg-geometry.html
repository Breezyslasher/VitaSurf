<!DOCTYPE html>
<!--
  SVG's DOM (VitaSurf, vita/js/svg.js): each SVG element's interface,
  the animated values (lengths, the viewBox, transform lists, points),
  and the geometry worked out from the attributes: bounding boxes
  through transforms, the matrices through each viewport's viewBox, a
  path's length and the points along it, and the fill test. Every
  expected value is what Chrome gives for the same page but three
  lengths: Chrome measures a curve by chords and is short, at 136.908
  for the path, 30.615 for the circle and 55.314 for the rounded rect,
  where they are 136.905, 31.416 (10 pi) and 56.566 (32 + 12 + 4 pi).
  Each line must say PASS.
-->
<html><head><meta charset="utf-8"><title>SVG geometry</title></head><body style="margin:0">
<svg id="s" width="200" height="100" viewBox="0 0 100 50" style="display:block"><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse"><stop id="st" offset="40%"/></linearGradient><rect id="sym" width="7" height="3"/></defs><g id="g" transform="translate(10,5) scale(2)"><rect id="r" x="1" y="2" width="10" height="4" transform="rotate(90)"/><circle id="c" cx="20" cy="10" r="5"/></g><path id="p" d="M0 0 C 10 20 30 20 40 0 A 10 5 0 0 1 60 0 Z"/><text id="t" x="5" y="40" font-size="10">Hello</text><svg id="n" x="5" y="5" width="20" height="10" viewBox="0 0 10 10"><rect id="nr" width="10" height="10"/></svg><svg id="sl" width="20" height="10" viewBox="0 0 10 10" preserveAspectRatio="xMinYMin slice"><rect width="1" height="1"/></svg><svg id="no" width="20" height="10" viewBox="0 0 10 10" preserveAspectRatio="none"><rect width="1" height="1"/></svg><rect id="rr" width="20" height="10" rx="2"/><line id="ln" x1="1" y1="1" x2="4" y2="5"/><polyline id="pl" points="0,0 3,4 3,10"/><use id="u" href="#sym" x="3" y="4"/><use id="u2" xlink:href="#sym"/><g id="gh"><rect width="2" height="2"/><rect x="50" width="2" height="2" display="none"/></g><g id="t2" transform="translate(1 2) rotate(30 5 5) scale(2)"></g><rect id="lc" width="1cm" height="1in"/></svg>
<pre id="out"></pre>
<script>
function $(id){return document.getElementById(id);}
function r3(v){return +(+v).toFixed(3);}
function box(b){return [b.x,b.y,b.width,b.height].map(r3).join(',');}
function mat(m){return m?[m.a,m.b,m.c,m.d,m.e,m.f].map(r3).join(','):'null';}
var CASES=[
['rect box',function(){return box($('r').getBBox());}],
['circle box',function(){return box($('c').getBBox());}],
['group box through transforms',function(){return box($('g').getBBox());}],
['path box with a curve and an arc',function(){return box($('p').getBBox());}],
['svg box',function(){return box($('s').getBBox());}],
['nested svg box',function(){return box($('n').getBBox());}],
['polyline box',function(){return box($('pl').getBBox());}],
['use box',function(){return box($('u').getBBox());}],
['hidden child left out',function(){return box($('gh').getBBox());}],
['a detached rect',function(){var e=document.createElementNS('http://www.w3.org/2000/svg','rect');e.setAttribute('width','5');return box(e.getBBox());}],
['rect CTM',function(){return mat($('r').getCTM());}],
['group CTM',function(){return mat($('g').getCTM());}],
['svg CTM is its viewBox',function(){return mat($('s').getCTM());}],
['nested svg CTM',function(){return mat($('n').getCTM());}],
['inside nested svg CTM',function(){return mat($('nr').getCTM());}],
['inside nested svg screen CTM',function(){return mat($('nr').getScreenCTM());}],
['slice viewBox CTM',function(){return mat($('sl').getCTM());}],
['none viewBox CTM',function(){return mat($('no').getCTM());}],
['path length',function(){return r3($('p').getTotalLength());}],
['point along a path',function(){var q=$('p').getPointAtLength(20);return r3(q.x)+','+r3(q.y);}],
['point past the end',function(){var q=$('p').getPointAtLength(1000);return r3(q.x)+','+r3(q.y);}],
['circle length',function(){return r3($('c').getTotalLength());}],
['rounded rect length',function(){return r3($('rr').getTotalLength());}],
['line length',function(){return r3($('ln').getTotalLength());}],
['polyline length',function(){return r3($('pl').getTotalLength());}],
['point in a circle fill',function(){var p=$('s').createSVGPoint();p.x=20;p.y=10;return $('c').isPointInFill(p);}],
['point outside a circle fill',function(){var p=$('s').createSVGPoint();p.x=26;p.y=10;return $('c').isPointInFill(p);}],
['viewBox',function(){var v=$('s').viewBox.baseVal;return [v.x,v.y,v.width,v.height].join(',');}],
['width as a length',function(){var w=$('s').width.baseVal;return w.value+' '+w.unitType+' '+w.valueAsString;}],
['no viewBox',function(){var e=document.createElementNS('http://www.w3.org/2000/svg','svg');var v=e.viewBox.baseVal;return v===null?'null':[v.x,v.y,v.width,v.height].join(',');}],
['default width',function(){var e=document.createElementNS('http://www.w3.org/2000/svg','svg');return e.width.baseVal.valueAsString+' '+e.width.baseVal.unitType;}],
['rect x',function(){return $('r').x.baseVal.value;}],
['length in cm',function(){var l=$('lc').width.baseVal;return r3(l.value)+' '+l.unitType+' '+l.valueInSpecifiedUnits;}],
['set a length value',function(){var l=$('lc').height.baseVal;l.value=96;return $('lc').getAttribute('height');}],
['convert a length',function(){var l=$('lc').width.baseVal;l.convertToSpecifiedUnits(5);return l.valueAsString;}],
['write the viewBox',function(){var e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.viewBox.baseVal;e.setAttribute('viewBox','1 2 3 4');return e.viewBox.baseVal.width;}],
['animVal is read-only',function(){try{$('r').x.animVal.value=3;return 'set';}catch(e){return e.name;}}],
['consolidate',function(){var c=$('g').transform.baseVal.consolidate();return mat(c.matrix);}],
['transform list count',function(){return $('t2').transform.baseVal.numberOfItems;}],
['transform item kinds',function(){var l=$('t2').transform.baseVal,o=[];for(var i=0;i<l.numberOfItems;i++)o.push(l.getItem(i).type);return o.join(',');}],
['rotate angle',function(){return $('t2').transform.baseVal.getItem(1).angle;}],
['set a translate',function(){var e=document.createElementNS('http://www.w3.org/2000/svg','g');var t=$('s').createSVGTransform();t.setTranslate(3,4);e.transform.baseVal.appendItem(t);return mat(e.transform.baseVal.consolidate().matrix);}],
['no transform consolidates to null',function(){return $('c').transform.baseVal.consolidate();}],
['matrix multiply',function(){var m=$('s').createSVGMatrix().translate(10,20).scale(2);return mat(m);}],
['matrix inverse',function(){return mat($('s').createSVGMatrix().translate(10,20).scale(2).inverse());}],
['point through a matrix',function(){var p=$('s').createSVGPoint();p.x=1;p.y=1;var q=p.matrixTransform($('s').createSVGMatrix().rotate(90));return r3(q.x)+','+r3(q.y);}],
['points list',function(){var l=$('pl').points;return l.numberOfItems+' '+l.getItem(1).x+','+l.getItem(1).y;}],
['href',function(){return $('u').href.baseVal;}],
['xlink href',function(){return $('u2').href.baseVal;}],
['stop offset',function(){return $('st').offset.baseVal;}],
['gradient units',function(){return $('lg').gradientUnits.baseVal;}],
['ownerSVGElement',function(){return $('nr').ownerSVGElement.id+' '+($('s').ownerSVGElement===null);}],
['nearestViewportElement',function(){return $('r').nearestViewportElement.id;}],
['farthestViewportElement',function(){return $('nr').farthestViewportElement.id;}],
['getElementById',function(){return $('s').getElementById('nr').localName;}],
['number of chars',function(){return $('t').getNumberOfChars();}],
['text length is measured',function(){return $('t').getComputedTextLength()>10;}],
['interfaces',function(){return [$('r'),$('g'),$('t'),$('p'),$('c'),$('pl'),$('u'),$('lg'),$('st'),$('s')].map(function(e){return Object.getPrototypeOf(e).constructor.name;}).join(' ');}],
['geometry chain',function(){return SVGRectElement.prototype instanceof SVGGeometryElement&&SVGGeometryElement.prototype instanceof SVGGraphicsElement;}],
['getBBox on the interface',function(){return Object.prototype.hasOwnProperty.call(SVGGraphicsElement.prototype,'getBBox');}],
['getTotalLength on the interface',function(){return Object.prototype.hasOwnProperty.call(SVGGeometryElement.prototype,'getTotalLength');}],
['an svg has no HTML width',function(){return typeof $('s').width;}],
['what a point is',function(){return Object.prototype.toString.call($('s').createSVGPoint());}],
['what a box is',function(){return Object.prototype.toString.call($('r').getBBox());}],
['length constants',function(){return SVGLength.SVG_LENGTHTYPE_PX+' '+SVGLength.prototype.SVG_LENGTHTYPE_PERCENTAGE;}],
['transform constants',function(){return SVGTransform.SVG_TRANSFORM_ROTATE;}],
['an illegal constructor',function(){try{new SVGLength();return 'made';}catch(e){return e.name;}}]
];
var WANT={
"rect box": "1,2,10,4",
"circle box": "15,5,10,10",
"group box through transforms": "-6,1,31,14",
"path box with a curve and an arc": "0,-5,60,20",
"svg box": "-2,-5,62,101",
"nested svg box": "0,0,10,10",
"polyline box": "0,0,3,10",
"use box": "3,4,7,3",
"hidden child left out": "0,0,2,2",
"a detached rect": "0,0,0,0",
"rect CTM": "0,4,-4,0,20,10",
"group CTM": "4,0,0,4,20,10",
"svg CTM is its viewBox": "2,0,0,2,0,0",
"nested svg CTM": "2,0,0,2,20,10",
"inside nested svg CTM": "1,0,0,1,10,5",
"inside nested svg screen CTM": "2,0,0,2,20,10",
"slice viewBox CTM": "4,0,0,4,0,0",
"none viewBox CTM": "4,0,0,2,0,0",
"path length": 136.905,
"point along a path": "13.801,13.841",
"point past the end": "0,0",
"circle length": 31.416,
"rounded rect length": 56.566,
"line length": 5,
"polyline length": 11,
"point in a circle fill": true,
"point outside a circle fill": false,
"viewBox": "0,0,100,50",
"width as a length": "200 1 200",
"no viewBox": "0,0,0,0",
"default width": "100% 2",
"rect x": 1,
"length in cm": "37.795 6 1",
"set a length value": "1in",
"convert a length": "37.7953px",
"write the viewBox": 3,
"animVal is read-only": "NoModificationAllowedError",
"consolidate": "2,0,0,2,10,5",
"transform list count": 3,
"transform item kinds": "2,4,3",
"rotate angle": 30,
"set a translate": "1,0,0,1,3,4",
"no transform consolidates to null": null,
"matrix multiply": "2,0,0,2,10,20",
"matrix inverse": "0.5,0,0,0.5,-5,-10",
"point through a matrix": "-1,1",
"points list": "3 3,4",
"href": "#sym",
"xlink href": "#sym",
"stop offset": 0.4000000059604645,
"gradient units": 1,
"ownerSVGElement": "n true",
"nearestViewportElement": "s",
"farthestViewportElement": "s",
"getElementById": "rect",
"number of chars": 5,
"text length is measured": true,
"interfaces": "SVGRectElement SVGGElement SVGTextElement SVGPathElement SVGCircleElement SVGPolylineElement SVGUseElement SVGLinearGradientElement SVGStopElement SVGSVGElement",
"geometry chain": true,
"getBBox on the interface": true,
"getTotalLength on the interface": true,
"an svg has no HTML width": "object",
"what a point is": "[object SVGPoint]",
"what a box is": "[object SVGRect]",
"length constants": "5 2",
"transform constants": 4,
"an illegal constructor": "TypeError"
};
var out=[];
function ok(name, got, want) { var l = (got === want ? 'PASS ' : 'FAIL ') + name + (got === want ? '' : ': ' + got + ', want ' + want); out.push(l); console.log('svg-geometry: ' + l); }
CASES.forEach(function (c) {
  var v;
  try { v = c[1](); } catch (e) { v = 'threw ' + e.name; }
  ok(c[0], JSON.stringify(v), JSON.stringify(WANT[c[0]]));
});
document.getElementById('out').textContent = out.join('\n');
console.log('svg-geometry: done');
</script></body></html>
