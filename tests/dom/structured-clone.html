<!DOCTYPE html>
<!-- structuredClone as the HTML standard's serialisation has it: an
     Error keeps its type, a boxed primitive stays boxed, an array keeps
     its length and its other properties, and a node, an event, a
     promise, a WeakMap or a URL cannot be cloned. Ours went through
     the form IndexedDB stores, JSON's shape, and lost the first three
     and copied the rest. Expected lines are what Chrome prints. -->
<html><head><title>structured clone</title></head><body><script>
function d(v,depth){depth=depth||0;if(depth>3)return '…';
 if(v===null)return 'null';var t=typeof v;
 if(t==='undefined')return 'undef';if(t==='number')return Object.is(v,-0)?'-0':String(v);
 if(t==='bigint')return v+'n';if(t==='string')return JSON.stringify(v);if(t==='boolean')return String(v);
 if(t==='function')return 'fn';if(t==='symbol')return 'sym';
 var tag=Object.prototype.toString.call(v);
 if(v instanceof Date)return 'Date('+v.getTime()+')';
 if(v instanceof RegExp)return 'RegExp('+v.source+'/'+v.flags+')';
 if(v instanceof Map)return 'Map{'+Array.from(v).map(function(e){return d(e[0],depth+1)+'=>'+d(e[1],depth+1);}).join(',')+'}';
 if(v instanceof Set)return 'Set{'+Array.from(v).map(function(e){return d(e,depth+1);}).join(',')+'}';
 if(v instanceof ArrayBuffer)return 'AB('+v.byteLength+')';
 if(ArrayBuffer.isView(v))return tag+'['+Array.prototype.slice.call(v.buffer?new Uint8Array(v.buffer,v.byteOffset,v.byteLength):[]).join(',')+']';
 if(v instanceof Error)return 'Error('+v.name+':'+v.message+')';
 if(Array.isArray(v))return '['+v.length+':'+Object.keys(v).map(function(k){return k+'='+d(v[k],depth+1);}).join(',')+']';
 return tag+'{'+Object.keys(v).map(function(k){return k+':'+d(v[k],depth+1);}).join(',')+'}';}
function t(n,f){var r;try{var v=f();r=d(structuredClone(v));}catch(e){r='throws '+e.name;}console.log('XX '+n+' '+r);}
t('undef',function(){return undefined;});
t('negzero',function(){return -0;});
t('nan',function(){return NaN;});
t('bigint',function(){return 12n;});
t('date',function(){return new Date(5);});
t('regexp',function(){return /a.b/gi;});
t('map',function(){return new Map([[1,{a:2}],['k',[3]]]);});
t('set',function(){return new Set([1,'x']);});
t('ab',function(){return new Uint8Array([1,2,3]).buffer;});
t('u8',function(){return new Uint8Array([4,5]);});
t('f32',function(){return new Float32Array([1.5]);});
t('dv',function(){return new DataView(new ArrayBuffer(2));});
t('error',function(){return new TypeError('boom');});
t('sparse',function(){var a=[1,,3];a.x=5;return a;});
t('nullproto',function(){var o=Object.create(null);o.a=1;return o;});
t('getter',function(){return {get g(){return 7;}};});
t('fn',function(){return {f:function(){}};});
t('sym',function(){return Symbol('x');});
t('symkey',function(){var o={a:1};o[Symbol('s')]=2;return o;});
t('cycle',function(){var o={a:1};o.self=o;return o;});
t('shared',function(){var s={x:1};return [s,s];});
t('boxed',function(){return [new Number(3),new String('s'),new Boolean(false)];});
t('class',function(){function C(){this.a=1;}C.prototype.b=2;return new C();});
t('nonenum',function(){var o={};Object.defineProperty(o,'h',{value:1,enumerable:false});o.v=2;return o;});
t('dom',function(){return document.body;});
t('event',function(){return new Event('x');});
t('promise',function(){return Promise.resolve(1);});
t('weakmap',function(){return new WeakMap();});
t('nested',function(){return {a:{b:{c:[1,{d:new Date(0)}]}}};});
t('nav',function(){return navigator;});
t('loc',function(){return location;});
t('url',function(){return new URL('http://a.b/c');});
t('bigarr',function(){return new BigInt64Array([1n]);});
t('arraylen',function(){var a=[];a.length=3;return a;});
t('numkey',function(){return {1:'a',b:2};});
t('domexc',function(){return new DOMException('m','DataCloneError');});
</script></body></html>
