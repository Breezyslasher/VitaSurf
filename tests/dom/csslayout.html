<!DOCTYPE html><html><head><title>csslayout</title><style>
body { margin: 0; font-size: 16px; }
.probe { background: #eee; }
</style></head><body>
<pre id="out"></pre>
<div id="r1"><div class="probe" id="p1" style="display:inline-block">x</div><div id="a1">after</div></div>
<div id="r2"><div class="probe" id="p2" style="display:inline-flex">x</div><div id="a2">after</div></div>
<div id="r3"><div class="probe" id="p3" style="display:inline-grid">x</div><div id="a3">after</div></div>
<div id="r4"><div class="probe" id="p4" style="display:inline">x</div><div id="a4">after</div></div>
<div id="r5"><div class="probe" id="p5" style="display:flex">x</div><div id="a5">after</div></div>
<div id="r6"><div class="probe" id="p6" style="display:inline-flex;height:40px">x</div><div id="a6">after</div></div>
<script>
function T(n,v){var o=document.getElementById('out');
 o.textContent+='XX '+n+': '+v+'\n';try{console.log('XX '+n+': '+v);}catch(e){}}
/* An inline-level box has to give its line a height, or whatever follows
   is painted on top of it. Absolute pixel values differ between engines,
   so ask only whether the next block clears the box. */
function clears(pid, aid){
 var p=document.getElementById(pid).getBoundingClientRect();
 var a=document.getElementById(aid).getBoundingClientRect();
 if(p.height===0) return 'box has no height';
 return a.top >= p.bottom ? 'clears' : 'overlaps';
}
function report(){
 T('inline-block', clears('p1','a1'));
 T('inline-flex', clears('p2','a2'));
 T('inline-grid', clears('p3','a3'));
 T('inline', clears('p4','a4'));
 T('flex', clears('p5','a5'));
 T('inline-flex with height', clears('p6','a6'));
 T('inline-flex height honoured',
   document.getElementById('p6').getBoundingClientRect().height);
}
window.addEventListener('load', function(){ setTimeout(report, 300); });
</script></body></html>
